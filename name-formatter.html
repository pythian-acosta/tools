<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name Formatter</title>
  <link rel="stylesheet" href="css/name-formatter.css">
</head>
<body>
  <h1>Name Formatter</h1>
  <textarea id="inputNames" placeholder="Enter names, one per line..."></textarea>

  <div class="input-group">
    <label class="label-with-checkbox" for="prefix">
      <input type="checkbox" id="enablePrefix" checked>
      <span>Prefix:</span>
    </label>
    <input type="text" id="prefix" placeholder="e.g. server">

    <label class="label-with-checkbox" for="suffix">
      <input type="checkbox" id="enableSuffix" checked>
      <span>Suffix:</span>
    </label>
    <input type="text" id="suffix" placeholder="e.g. -environment">
  </div>

  <div id="error" class="error"></div>

  <div class="output">
    <div class="output-box">
      <div class="output-header">
        <strong>Output 1 (space-separated):</strong>
        <button class="copy-btn" onclick="copyToClipboard('output1', this)">Copy</button>
      </div>
      <span id="output1"></span>
    </div>
    <div class="output-box">
      <div class="output-header">
        <strong>Output 2 (pipe-separated):</strong>
        <button class="copy-btn" onclick="copyToClipboard('output2', this)">Copy</button>
      </div>
      <span id="output2"></span>
    </div>
    <div class="output-box">
      <div class="output-header">
        <strong>Output 3 (--tag name=):</strong>
        <button class="copy-btn" onclick="copyToClipboard('output3', this)">Copy</button>
      </div>
      <span id="output3"></span>
    </div>
    <div class="output-box">
      <div class="output-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <strong>Output 4</strong>
          <input type="text" id="customCommand" placeholder="e.g. --role name=" style="width: 200px;" />
        </div>
        <button class="copy-btn" onclick="copyToClipboard('output4', this)">Copy</button>
      </div>
      <span id="output4"></span>
    </div>    
  </div>

  <script src="js/name-formatter.js"></script>
</body>
</html>
